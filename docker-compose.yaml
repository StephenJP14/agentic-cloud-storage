services:
  # 1. Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  # 2. Object Storage (MinIO)
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  # 3. Cache/Memory
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 4. Database
  db:
    image: postgres:14-alpine
    container_name: db-landing
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: landing_page
    volumes:
      - pgdata_landing:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - landing_internal

  # 5. Database GUI (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password123
    depends_on:
      - db

  backend-py:
    build: backend-py
    container_name: backend-py
    volumes:
      - ./backend-py:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - landing_internal

  backend-go:
    build: backend-go
    container_name: backend-go
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: root
      DB_NAME: landing_page
      ADMIN_PASSWORD: 123
      API_KEY: ${API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ENV: ${ENV}
      QONTAK_CHANNEL_INTEGRATION_ID: ${QONTAK_CHANNEL_INTEGRATION_ID}
      QONTAK_API_TOKEN: ${QONTAK_API_TOKEN}
      CRON_SECRET: ${CRON_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_HOST}
      SMTP_USERNAME: ${SMTP_HOST}
      SMTP_PASSWORD: ${SMTP_HOST}
      SMTP_FROM: ${SMTP_HOST}
      SMTP_FROM_NAME: ${SMTP_HOST}
      SMTP_DOMAIN: ${SMTP_HOST}
      SMTP_RECIPIENTS: ${SMTP_RECIPIENTS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landing_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
    container_name: fe-landing
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_URL: ${API_URL}
      API_KEY: ${API_KEY}
    depends_on:
      - backend-go
    networks:
      - landing_internal

volumes:
  pgdata_landing:

networks:
  landing_internal:
    driver: bridge
